name: Docker Image CI/CD

on:
  push:
    branches:
      - dev-next
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # Harbor 私有镜像仓库配置
  REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
  IMAGE_NAME: ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/sing-box-apex

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: 登录到 Harbor 镜像仓库
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: 获取版本信息
        id: version
        run: |
          set -xeuo pipefail
          VERSION=$(go run ./cmd/internal/read_tag 2>/dev/null || echo "dev")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "构建版本: ${VERSION}"

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # 版本标签: v1.0.0
            type=semver,pattern={{version}}
            # 主版本.次版本: v1.0
            type=semver,pattern={{major}}.{{minor}}
            # 主版本: v1
            type=semver,pattern={{major}}
            # 提交 SHA 短标签
            type=sha,prefix={{branch}}-,format=short
            # 分支名作为标签
            type=ref,event=branch
            # main-next 分支打 latest tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main-next' }}
          flavor: |
            latest=false

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 优化缓存策略
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 仅构建 amd64 平台
          platforms: linux/amd64
          # 构建参数
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILDKIT_INLINE_CACHE=1
          # 禁用 provenance 和 sbom 以加快构建
          provenance: false
          sbom: false

      - name: 输出镜像信息
        run: |
          echo "### Docker 镜像构建成功 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**镜像版本:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**镜像标签:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**构建平台:** linux/amd64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**拉取命令:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
