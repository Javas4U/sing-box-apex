# sing-box 日志轮转配置
# 在宿主机上使用 logrotate 管理日志

/path/to/sing-box/logs/*.log {
    # 每天轮转一次
    daily

    # 保留 30 天的日志
    rotate 30

    # 如果日志文件不存在,不报错
    missingok

    # 不轮转空日志
    notifempty

    # 使用日期作为后缀
    dateext
    dateformat -%Y%m%d

    # 压缩旧日志
    compress
    delaycompress

    # 轮转后的权限
    create 0644 root root

    # 轮转后执行的脚本
    postrotate
        # 通知 sing-box 重新打开日志文件
        docker exec sing-box-server killall -SIGUSR1 sing-box 2>/dev/null || true
    endscript

    # 共享脚本,避免每个日志文件都执行一次
    sharedscripts
}
